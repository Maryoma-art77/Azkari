
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكاري 🌿</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap');

:root {
  --bg: #f5f1e7;
  --card: #fffdf7;
  --text: #344333;
  --green: #687b55;
  --green2: #879875;
  --gold: #b69b62;
  --muted: #8a8b78;
  --border: #e5e0d2;
  --shadow: 0 5px 20px #34433312;
}

body.dark {
  --bg: #20291f;
  --card: #2c382b;
  --text: #f0eddf;
  --green: #a5b98c;
  --green2: #81966e;
  --gold: #d2b879;
  --muted: #c0c0aa;
  --border: #465341;
  --shadow: 0 5px 20px #00000030;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  transition: .3s;
}

header {
  text-align: center;
  padding: 30px 15px 22px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: relative;
}

header h1 {
  margin: 0;
  font-family: 'Amiri', serif;
  font-size: 42px;
  color: var(--green);
}

header p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.theme-btn {
  position: absolute;
  left: 15px;
  top: 18px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 50px;
  padding: 8px 12px;
  cursor: pointer;
  font-family: inherit;
}

.container {
  width: min(900px, 94%);
  margin: 22px auto 50px;
}

nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

nav button {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 13px;
  padding: 11px 5px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

nav button.active,
nav button:hover {
  background: var(--green);
  color: white;
  border-color: var(--green);
}

.page-title {
  text-align: center;
  color: var(--green);
  font-family: 'Amiri', serif;
  font-size: 30px;
  margin: 15px 0 5px;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 20px;
}

.progress-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 14px;
  margin-bottom: 15px;
  box-shadow: var(--shadow);
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 9px;
  color: var(--muted);
}

.progress-track {
  height: 9px;
  background: var(--border);
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: var(--green2);
  border-radius: 20px;
  transition: .3s;
}

.dhikr-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 18px;
  margin-bottom: 13px;
  box-shadow: var(--shadow);
  transition: .2s;
}

.dhikr-card.done {
  border-color: var(--green2);
  background: color-mix(in srgb, var(--green) 8%, var(--card));
}

.dhikr-title {
  color: var(--green);
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 10px;
}

.dhikr-text {
  font-family: 'Amiri', serif;
  font-size: 23px;
  line-height: 2;
  text-align: center;
  margin: 10px 0 15px;
  white-space: pre-line;
}

.dhikr-note {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  margin-bottom: 12px;
}

.counter-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
}

.counter-btn {
  width: 48px;
  height: 43px;
  border: 0;
  border-radius: 12px;
  background: var(--green);
  color: white;
  font-size: 22px;
  cursor: pointer;
}

.counter-btn:disabled {
  opacity: .35;
  cursor: default;
}

.counter-number {
  min-width: 75px;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
}

.counter-number small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
}

.reset-btn {
  display: block;
  margin: 18px auto;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  border-radius: 20px;
  padding: 8px 20px;
  font-family: inherit;
  cursor: pointer;
}

.prayer-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 18px;
  margin-top: 25px;
  box-shadow: var(--shadow);
}

.prayer-box h2 {
  text-align: center;
  color: var(--green);
  font-family: 'Amiri', serif;
  font-size: 27px;
  margin: 0 0 5px;
}

.prayer-date {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}

.prayer-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 5px;
  border-bottom: 1px solid var(--border);
}

.prayer-row:last-child { border: 0; }

.prayer-name { font-weight: 700; }
.prayer-time { color: var(--green); font-weight: 800; }

.loading, .error {
  text-align: center;
  color: var(--muted);
  padding: 15px;
  font-size: 13px;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 25px 10px;
}

.hidden { display: none; }

@media (max-width: 520px) {
  nav { grid-template-columns: repeat(2, 1fr); }
  header h1 { font-size: 36px; }
  .dhikr-text { font-size: 21px; }
  .theme-btn { font-size: 11px; }
}
</style>
</head>

<body>

<header>
  <button class="theme-btn" onclick="toggleTheme()">🌙 الوضع الليلي</button>
  <h1>أذكاري 🌿</h1>
  <p>وَاذْكُرُوا اللَّهَ كَثِيرًا لَعَلَّكُمْ تُفْلِحُونَ</p>
</header>

<main class="container">

  <nav id="navigation">
    <button class="active" onclick="showPage('morning', this)">☀️ الصباح</button>
    <button onclick="showPage('evening', this)">🌙 المساء</button>
    <button onclick="showPage('afterPrayer', this)">🤲 بعد الصلاة</button>
    <button onclick="showPage('sleep', this)">🛏️ أذكار النوم</button>
    <button onclick="showPage('wake', this)">🌅 الاستيقاظ</button>
  </nav>

  <h2 class="page-title" id="pageTitle">☀️ أذكار الصباح</h2>
  <p class="subtitle" id="pageSubtitle">ابدئي يومك بذكر الله 🌿</p>

  <section class="progress-box">
    <div class="progress-info">
      <span>إنجازك في هذا القسم</span>
      <span id="progressText">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </section>

  <section id="adhkarList"></section>

  <button class="reset-btn" onclick="resetPage()">إعادة عدادات القسم ↺</button>

  <section class="prayer-box">
    <h2>🕌 مواقيت الصلاة</h2>
    <div class="prayer-date" id="prayerDate">القاهرة - مصر</div>
    <div id="prayerTimes">
      <div class="loading">جاري تحميل مواقيت الصلاة...</div>
    </div>
  </section>

</main>

<footer>
  🌿 أذكاري — اللهم اجعل ألسنتنا عامرة بذكرك وقلوبنا مطمئنة بك 🌿
</footer>

<script>
// نصوص قرآنية وأذكار مختارة
const ayatKursi =
"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ";

const ikhlas =
"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ";

const falaq =
"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ";

const nas =
"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ";

const threeQuls = ikhlas + "\n\n" + falaq + "\n\n" + nas;

const morningEvening = [
  {
    title: "آية الكرسي",
    text: ayatKursi,
    count: 1,
    note: "مرة واحدة"
  },
  {
    title: "سورة الإخلاص والمعوذتين",
    text: threeQuls,
    count: 3,
    note: "ثلاث مرات"
  },
  {
    title: "أصبحنا وأصبح الملك لله",
    text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ. رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",
    count: 1
  },
  {
    title: "اللهم بك أصبحنا",
    text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.",
    count: 1
  },
  {
    title: "سيد الاستغفار",
    text: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.",
    count: 1
  },
  {
    title: "رضيت بالله ربًا",
    text: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا.",
    count: 3
  },
  {
    title: "اللهم إني أسألك العافية",
    text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي.",
    count: 1
  },
  {
    title: "بسم الله الذي لا يضر",
    text: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.",
    count: 3
  },
  {
    title: "حسبي الله",
    text: "حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.",
    count: 7
  },
  {
    title: "اللهم عافني في بدني",
    text: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ.",
    count: 3
  },
  {
    title: "سبحان الله وبحمده",
    text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.",
    count: 100
  }
];

const morning = morningEvening.map(item => ({...item}));

const evening = morningEvening.map((item, index) => {
  if (index === 2) {
    return {
      ...item,
      title: "أمسينا وأمسى الملك لله",
      text: item.text
        .replace("أَصْبَحْنَا وَأَصْبَحَ", "أَمْسَيْنَا وَأَمْسَى")
        .replace("هَذَا الْيَوْمِ", "هَذِهِ اللَّيْلَةِ")
        .replace("هَذَا الْيَوْمِ", "هَذِهِ اللَّيْلَةِ")
        .replace("النُّشُورُ", "الْمَصِيرُ")
    };
  }
  if (index === 3) {
    return {
      ...item,
      title: "اللهم بك أمسينا",
      text: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ."
    };
  }
  return {...item};
});

const afterPrayer = [
  {
    title: "الاستغفار",
    text: "أَسْتَغْفِرُ اللَّهَ",
    count: 3
  },
  {
    title: "اللهم أنت السلام",
    text: "اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.",
    count: 1
  },
  {
    title: "لا إله إلا الله وحده",
    text: "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
    count: 1
  },
  {
    title: "اللهم لا مانع لما أعطيت",
    text: "اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.",
    count: 1
  },
  {
    title: "التسبيح",
    text: "سُبْحَانَ اللَّهِ",
    count: 33
  },
  {
    title: "التحميد",
    text: "الْحَمْدُ لِلَّهِ",
    count: 33
  },
  {
    title: "التكبير",
    text: "اللَّهُ أَكْبَرُ",
    count: 33
  },
  {
    title: "آية الكرسي",
    text: ayatKursi,
    count: 1
  }
];

const sleep = [
  {
    title: "آية الكرسي",
    text: ayatKursi,
    count: 1
  },
  {
    title: "سورة الإخلاص والفلق والناس",
    text: threeQuls,
    count: 3,
    note: "تُقرأ مع النفث في الكفين ومسح ما استطاع من الجسد"
  },

let currentPage = "morning";
let counters = {};

Object.keys(pages).forEach(key => {
  counters[key] = pages[key].data.map(() => 0);
});

function showPage(page, button) {
  currentPage = page;

  document.querySelectorAll("#navigation button").forEach(btn => {
    btn.classList.remove("active");
  });

  if (button) {
    button.classList.add("active");
  } else {
    const index = Object.keys(pages).indexOf(page);
    document.querySelectorAll("#navigation button")[index].classList.add("active");
  }

  document.getElementById("pageTitle").textContent = pages[page].title;
  document.getElementById("pageSubtitle").textContent = pages[page].subtitle;

  renderAdhkar();
}

function renderAdhkar() {
  const list = document.getElementById("adhkarList");
  const data = pages[currentPage].data;

  list.innerHTML = data.map((item, index) => {
    const current = counters[currentPage][index];
    const done = current >= item.count;

    return `
      <article class="dhikr-card ${done ? "done" : ""}">
        <div class="dhikr-title">${item.title}</div>
        <div class="dhikr-text">${item.text}</div>
        ${item.note ? `<div class="dhikr-note">${item.note}</div>` : ""}
        <div class="counter-row">
          <button class="counter-btn"
            onclick="changeCounter(${index}, -1)"
            ${current <= 0 ? "disabled" : ""}>−</button>

          <div class="counter-number">
            ${current} / ${item.count}
            <small>${done ? "تم الذكر ✓" : "عدد التكرار"}</small>
          </div>

          <button class="counter-btn"
            onclick="changeCounter(${index}, 1)"
            ${done ? "disabled" : ""}>+</button>
        </div>
      </article>
    `;
  }).join("");

  updateProgress();
}

function changeCounter(index, amount) {
  const item = pages[currentPage].data[index];
  const next = counters[currentPage][index] + amount;

  if (next >= 0 && next <= item.count) {
    counters[currentPage][index] = next;
  }

  renderAdhkar();
}

function updateProgress() {
  const data = pages[currentPage].data;
  const total = data.reduce((sum, item) => sum + item.count, 0);
  const done = data.reduce((sum, item, index) => {
    return sum + counters[currentPage][index];
  }, 0);

  const percentage = total ? Math.round(done / total * 100) : 0;

  document.getElementById("progressText").textContent = percentage + "%";
  document.getElementById("progressFill").style.width = percentage + "%";
}

function resetPage() {
  counters[currentPage] = pages[currentPage].data.map(() => 0);
  renderAdhkar();
}

function toggleTheme() {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");
  document.querySelector(".theme-btn").textContent =
    isDark ? "☀️ الوضع النهاري" : "🌙 الوضع الليلي";
}

// مواقيت الصلاة - القاهرة
async function loadPrayerTimes() {
  const prayerBox = document.getElementById("prayerTimes");
  const dateBox = document.getElementById("prayerDate");

  try {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear();
    const dateString = `${day}-${month}-${year}`;

    const url = `https://api.aladhan.com/v1/timingsByCity/${dateString}?city=Cairo&country=Egypt&method=5`;

    const response = await fetch(url);
    if (!response.ok) throw new Error("تعذر الاتصال");

    const result = await response.json();
    if (result.code !== 200) throw new Error("تعذر تحميل المواقيت");

    const timings = result.data.timings;
    const date = result.data.date.readable;

    dateBox.textContent = `القاهرة - مصر | ${date}`;

    const prayerNames = [
      ["الفجر", "Fajr"],
      ["الشروق", "Sunrise"],
      ["الظهر", "Dhuhr"],
      ["العصر", "Asr"],
      ["المغرب", "Maghrib"],
      ["العشاء", "Isha"]
    ];

    prayerBox.innerHTML = prayerNames.map(([arabic, key]) => `
      <div class="prayer-row">
        <span class="prayer-name">${arabic}</span>
        <span class="prayer-time">${timings[key]}</span>
      </div>
    `).join("");

  } catch (error) {
    prayerBox.innerHTML = `
      <div class="error">
        لم نتمكن من تحميل المواقيت حاليًا.
        <br>تأكدي من اتصال الإنترنت وحاولي مرة أخرى.
        <br>
        <button class="reset-btn" onclick="loadPrayerTimes()">إعادة المحاولة</button>
      </div>
    `;
  }
}

renderAdhkar();
